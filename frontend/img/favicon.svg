<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .fundo { fill: #6B3F2A; }
    .marca { fill: #F5ECD7; }
    .grao  { fill: #C99A5B; }

    /* Na aba escura o contraste se inverte */
    @media (prefers-color-scheme: dark) {
      .fundo { fill: #F0E3CC; }
      .marca { fill: #2A1E15; }
      .grao  { fill: #8B5536; }
    }
  </style>

  <rect class="fundo" width="64" height="64" rx="16"/>

  <!-- xicara: corpo solido, pires e asa -->
  <path class="marca" d="M13 24h27v13a13.5 13.5 0 0 1-13.5 13.5h0A13.5 13.5 0 0 1 13 37z"/>
  <path class="marca" d="M41 27h3.5a8.5 8.5 0 0 1 0 17H41v-6h3.5a2.5 2.5 0 0 0 0-5H41z"/>
  <rect class="marca" x="9" y="53" width="36" height="4.5" rx="2.25"/>

  <!-- o cafe dentro, no tom caramelo -->
  <path class="grao" d="M18 29h17v7.5a8.5 8.5 0 0 1-8.5 8.5h0a8.5 8.5 0 0 1-8.5-8.5z"/>

  <!-- vapor -->
  <rect class="grao" x="21" y="9" width="4.5" height="10" rx="2.25"/>
  <rect class="grao" x="31" y="6" width="4.5" height="13" rx="2.25"/>
</svg>
